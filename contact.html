<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMT Boutique - Home</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>TMT Boutique</h1>
</header>

    <nav>
        index.htmlHome</a>
        products.htmlProducts</a>
        <antact.htmlContact & Orders</a>
    </nav>

    <main>
        <section>
            <h2>Contact & Orders</h2>

            <form>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="product">Select Product:</label><br>
                <select id="product" name="product" required>
                    <option value="">--Choose a Product--</option>
                    <option value="Dress">Dress</option>
                    <option value="Bag">Bag</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Beauty Product">Beauty Product</option>
                </select><br><br>

                <label for="quantity">Quantity:</label><br>
                <input type="number" id="quantity" name="quantity" min="1" required><br><br>

                <p><strong>Preferred Contact Method:</strong></p>

                <input type="radio" id="contact-email" name="contactmethod" value="Email" required>
                <label for="contact-email">Email</label>

                <input type="radio" id="contact-phone" name="contactmethod" value="Phone">
                <label for="contact-phone">Phone</label><br><br>

                <input type="checkbox" id="updates" name="updates">
                <label for="updates">I would like to receive promotions and updates.</label><br><br>

                <label for="details">Order Details:</label><br>
                <textarea id="details" name="details" rows="5" cols="40"
                    placeholder="Enter your order details here..." required></textarea><br><br>

                <button type="submit">Submit Order</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TMT Boutique. All Rights Reserved.</p>
    </footer>

</body>

</html>
